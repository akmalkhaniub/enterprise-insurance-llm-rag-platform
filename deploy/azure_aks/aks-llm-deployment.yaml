apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-llm-mining-deployment
  namespace: insurance-ai-prod
  labels:
    app: insurance-llm-mining
    tier: inference-and-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insurance-llm-mining
  template:
    metadata:
      labels:
        app: insurance-llm-mining
    spec:
      nodeSelector:
        agentpool: gpunc24adsa100v4
      containers:
        - name: insurance-llm-rag-gateway
          image: insureminingacr.azurecr.io/insurance-llm-rag-platform:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: azure-ai-secrets
                  key: openai-endpoint
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-ai-secrets
                  key: blob-connection-string
            - name: MLFLOW_TRACKING_URI
              value: "azureml://eastus2.api.azureml.ms/mlflow/v1.0/subscriptions/prod-sub/resourceGroups/rg-insure-ai"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insurance-llm-mining-hpa
  namespace: insurance-ai-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insurance-llm-mining-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
