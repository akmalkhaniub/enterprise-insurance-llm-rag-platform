$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: qwen25-qlora-unsloth-insurance-policy-finetune
experiment_name: insurance-llm-mining-production
description: >
  Distributed 4-Bit QLoRA & Unsloth fine-tuning of Qwen2.5-Instruct on long-context
  commercial insurance policies and claims adjudication JSON schemas using DeepSpeed ZeRO-2.
compute: azureml:gpu-nc24ads-a100-cluster
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
resources:
  instance_count: 2
distribution:
  type: pytorch
  process_count_per_instance: 2
inputs:
  policy_corpus_blob:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/insurance-policy-corpus/v1
  lora_rank: 16
  lora_alpha: 32
  max_seq_length: 32768
outputs:
  trained_lora_adapter:
    type: uri_folder
    mode: rw_mount
command: >-
  deepspeed --num_gpus 2 src/train_distributed_qlora.py
  --deepspeed deploy/deepspeed/ds_zero2_qlora_config.json
  --data_path ${{inputs.policy_corpus_blob}}
  --lora_r ${{inputs.lora_rank}}
  --lora_alpha ${{inputs.lora_alpha}}
  --max_seq_length ${{inputs.max_seq_length}}
  --output_dir ${{outputs.trained_lora_adapter}}
