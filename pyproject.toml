[project]
name = "enterprise-insurance-llm-rag-platform"
version = "1.0.0"
description = "Enterprise Insurance Mining, LLM Fine-Tuning (Unsloth/QLoRA/PEFT), Long-Context Extraction, Hybrid FAISS/BM25 RAG, Agentic Claims Adjudication & Azure MLOps Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
